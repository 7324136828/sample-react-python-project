name: Build and release Windows binaries

on:
  # Merging a pull request into main pushes the merged commit and starts a release build.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify Windows x64 packages
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Isolate application settings and data for CI
        run: |
          $ciRoot = Join-Path $env:RUNNER_TEMP 'sample-react-python-ci'
          $settings = Join-Path $ciRoot 'settings'
          $database = Join-Path $ciRoot 'counter.db'
          "APPDATA=$settings" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "COUNTER_DB_PATH=$database" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64

      - name: Set up Node.js
        id: node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Determine pip cache refresh period
        id: pip-cache-period
        run: |
          # Refresh weekly so new versions allowed by requirements can enter the cache.
          $today = [DateTime]::UtcNow.Date
          $week = $today.AddDays(-[int]$today.DayOfWeek).ToString('yyyyMMdd')
          "week=$week" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # build.py uses these directories explicitly rather than the global caches.
      - name: Cache Python package downloads
        uses: actions/cache@v6
        with:
          path: build/pip-cache
          key: ${{ runner.os }}-${{ runner.arch }}-pip-v1-${{ steps.python.outputs.python-version }}-${{ hashFiles('backend/requirements.txt', 'backend/requirements-build.txt') }}-${{ steps.pip-cache-period.outputs.week }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pip-v1-${{ steps.python.outputs.python-version }}-${{ hashFiles('backend/requirements.txt', 'backend/requirements-build.txt') }}-
            ${{ runner.os }}-${{ runner.arch }}-pip-v1-${{ steps.python.outputs.python-version }}-

      - name: Cache npm package downloads
        uses: actions/cache@v6
        with:
          path: build/npm-cache
          key: ${{ runner.os }}-${{ runner.arch }}-npm-v1-${{ steps.node.outputs.node-version }}-${{ hashFiles('frontend/package-lock.json', 'e2e/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-npm-v1-${{ steps.node.outputs.node-version }}-

      - name: Build portable applications and smoke-test binaries
        env:
          NPM_CONFIG_PREFER_OFFLINE: 'true'
        run: |
          python build.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run backend, launcher, and packaging tests
        run: |
          .\.venv\Scripts\python.exe -m unittest discover -s backend/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install browser test dependencies
        working-directory: e2e
        run: |
          npm.cmd ci --cache "$env:GITHUB_WORKSPACE/build/npm-cache" --prefer-offline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run browser tests
        working-directory: e2e
        run: |
          npm.cmd run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package binaries and generate timestamp version
        id: package
        run: |
          # UTC: YYYY.MM.DDHHmm. The version is also the release tag, without a prefix.
          $version = [DateTime]::UtcNow.ToString('yyyy.MM.ddHHmm')
          $destination = Join-Path $env:GITHUB_WORKSPACE 'build/release-assets'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          foreach ($profile in @('Debug', 'Release')) {
            $source = Join-Path $env:GITHUB_WORKSPACE "dist/$profile"
            $archive = Join-Path $destination "sample-react-python-project-$version-windows-x64-$profile.zip"
            [System.IO.Compression.ZipFile]::CreateFromDirectory(
              $source, $archive, [System.IO.Compression.CompressionLevel]::Optimal, $true
            )
          }
          $checksums = Get-ChildItem -LiteralPath $destination -Filter '*.zip' |
            Sort-Object Name | ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
          $checksums | Set-Content -LiteralPath (Join-Path $destination 'SHA256SUMS.txt') -Encoding ascii
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "Built Windows x64 packages: **$version** (UTC)." |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64-${{ steps.package.outputs.version }}
          path: build/release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v7
        with:
          name: windows-x64-${{ needs.build.outputs.version }}
          path: release-assets

      - name: Create timestamped release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          cat > release-notes.md <<'EOF'
          Portable Windows x64 packages. Extract the chosen ZIP and run `run.bat` inside its folder.

          - **Debug:** local access on `127.0.0.1`.
          - **Release:** LAN access on `0.0.0.0`.

          Keep the entire extracted folder: server.exe serves the included frontend and API, and run.bat uses the included runtime.json and port_mapping.json configuration files. Python and Node.js are not required on the target machine.

          `SHA256SUMS.txt` contains checksums for both ZIPs. The release version uses UTC in `YYYY.MM.DDHHmm` format.
          EOF
          gh release create "$RELEASE_VERSION" release-assets/* \
            --repo "$GH_REPO" \
            --target "$RELEASE_COMMIT" \
            --title "$RELEASE_VERSION" \
            --notes-file release-notes.md \
            --generate-notes
